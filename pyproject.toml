[project]
name = "slg"
version = "0.1.0"
description = "2D souls-like in a dying world (pygame-ce, procedural everything)"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",
]

[project.scripts]
slg = "slg.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
